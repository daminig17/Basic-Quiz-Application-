<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Web Dev Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="signup-body">
  <div class="signup-container">
    <h1>🚀 Welcome to the Web Development Challenge!</h1>
    <p>Please sign up to begin your quiz journey.</p>
    <form id="signupForm" onsubmit="return goToQuiz(event)">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="text" id="course" placeholder="Course" required />
      <input type="text" id="year" placeholder="Year" required />
      <button type="submit">Sign Up & Start Quiz</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
